name: Python smoke and safety tests
on:
  push:
    branches: [main, feature/safe-eye-photo-triage]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Syntax validation
        run: python -m compileall -q streamlit_app.py triage.py eye_quality.py triage_export.py fusion.py fhir_export.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
